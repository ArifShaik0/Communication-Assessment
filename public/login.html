<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Communication Assessment Suite</title>
    <link rel="stylesheet" href="auth-styles.css">
</head>
<body>
    <div class="container">
        <!-- Header Section -->
        <div class="header">
            <h1>🎯 Communication Assessment Suite</h1>
            <p>Welcome back! Please sign in to continue your learning journey</p>
        </div>

        <!-- Login Form -->
        <div class="auth-form">
            <h2>Log In to Your Account</h2>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                    <div class="error-message" id="email-error"></div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                    <div class="error-message" id="password-error"></div>
                </div>

                <div class="form-group">
                    <button type="submit" class="btn btn-primary" id="login-btn">
                        <span class="btn-text">Sign In</span>
                        <div class="loading" id="login-loading">
                            <div class="spinner"></div>
                        </div>
                    </button>
                </div>

                <div class="form-links">
                    <p>Don't have an account? <a href="/signup">Sign up here</a></p>
                    <p><a href="/forgot-password">Forgot your password?</a></p>
                    <p><a href="/">← Back to Homepage</a></p>
                </div>
            </form>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>&copy; 2024 Communication Assessment Suite. Empowering better communication through AI.</p>
        </div>
    </div>

    <!-- Message Container -->
    <div id="message-container" class="message-container" style="display: none;">
        <div id="message" class="message"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('login-form');
            const loginBtn = document.getElementById('login-btn');
            const loginLoading = document.getElementById('login-loading');
            const btnText = document.querySelector('.btn-text');

            // Show messages from URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            const message = urlParams.get('message');
            const type = urlParams.get('type');
            
            if (message) {
                showMessage(decodeURIComponent(message), type || 'info');
            }

            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                // Clear previous errors
                clearErrors();
                
                // Get form data
                const formData = new FormData(loginForm);
                const email = formData.get('email').trim();
                const password = formData.get('password');

                // Basic validation
                let hasErrors = false;

                if (!email) {
                    showFieldError('email', 'Email is required');
                    hasErrors = true;
                } else if (!isValidEmail(email)) {
                    showFieldError('email', 'Please enter a valid email address');
                    hasErrors = true;
                }

                if (!password) {
                    showFieldError('password', 'Password is required');
                    hasErrors = true;
                }

                if (hasErrors) return;

                // Show loading state
                setLoadingState(true);

                try {
                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ email, password })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        showMessage('Login successful! Redirecting...', 'success');
                        setTimeout(() => {
                            window.location.href = '/assessment';
                        }, 1500);
                    } else {
                        if (data.field) {
                            showFieldError(data.field, data.error);
                        } else {
                            showMessage(data.error || 'Login failed. Please try again.', 'error');
                        }
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    showMessage('Network error. Please check your connection and try again.', 'error');
                } finally {
                    setLoadingState(false);
                }
            });

            function setLoadingState(loading) {
                if (loading) {
                    loginBtn.disabled = true;
                    btnText.style.display = 'none';
                    loginLoading.style.display = 'block';
                } else {
                    loginBtn.disabled = false;
                    btnText.style.display = 'inline';
                    loginLoading.style.display = 'none';
                }
            }

            function clearErrors() {
                const errorElements = document.querySelectorAll('.error-message');
                const inputElements = document.querySelectorAll('input');
                
                errorElements.forEach(el => el.textContent = '');
                inputElements.forEach(el => el.classList.remove('error', 'success'));
            }

            function showFieldError(fieldName, message) {
                const field = document.getElementById(fieldName);
                const errorElement = document.getElementById(fieldName + '-error');
                
                if (field && errorElement) {
                    field.classList.add('error');
                    errorElement.textContent = message;
                }
            }

            function isValidEmail(email) {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return emailRegex.test(email);
            }

            function showMessage(message, type) {
                const messageContainer = document.getElementById('message-container');
                const messageElement = document.getElementById('message');
                
                messageElement.textContent = message;
                messageElement.className = `message ${type}`;
                messageContainer.style.display = 'block';
                
                // Auto-hide after 5 seconds
                setTimeout(() => {
                    messageContainer.style.display = 'none';
                }, 5000);
            }

            // Real-time validation
            document.getElementById('email').addEventListener('input', function() {
                const email = this.value.trim();
                if (email && isValidEmail(email)) {
                    this.classList.remove('error');
                    this.classList.add('success');
                    document.getElementById('email-error').textContent = '';
                } else if (email) {
                    this.classList.remove('success');
                    this.classList.add('error');
                } else {
                    this.classList.remove('error', 'success');
                }
            });

            document.getElementById('password').addEventListener('input', function() {
                if (this.value.length >= 6) {
                    this.classList.remove('error');
                    this.classList.add('success');
                    document.getElementById('password-error').textContent = '';
                } else if (this.value) {
                    this.classList.remove('success');
                    this.classList.add('error');
                } else {
                    this.classList.remove('error', 'success');
                }
            });
        });
    </script>
</body>
</html>
