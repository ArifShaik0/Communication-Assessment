<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-YZV45WHW9X"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-YZV45WHW9X');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Communication Assessment Suite</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="shortcut icon" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">
    <link rel="stylesheet" href="auth-styles.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800;900&family=Nunito:wght@400;600;700&display=swap"
        rel="stylesheet">
    <script src="/js/mobile-detection.js"></script>
</head>

<body>
    <div class="container">
        <div class="topbar">
            <div class="brand">Skill Tesseract</div>
            <nav class="nav-links">
                <a href="/login" class="nav-link">Login</a>
                <a href="/signup" class="nav-link nav-cta">Sign Up</a>
            </nav>
        </div>

        <main class="home home-left">
            <!-- Hero Section - Full Page -->
            <section class="hero-section">
                <div class="hero-spotlight">
                    <h1>Welcome to the Communication Assessment Suite</h1>
                    <p class="subtitle">Enhance your pronunciation, comprehension, and grammar with engaging assessments
                        and personalized feedback</p>
                    <div class="scroll-arrow" onclick="document.querySelector('.video-section').scrollIntoView({behavior: 'smooth'})">
                        ↓
                    </div>
                </div>
            </section>

            <!-- Video Section - Full Page -->
            <section class="video-section">
                <div class="video-container">
                    <h2 class="video-title">Watch a Quick Demo</h2>
                    <div class="video-wrapper">
                        <iframe src="https://www.youtube.com/embed/tiJXqJLpSCk" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="width:100%;height:100%;position:absolute;top:0;left:0;" title="Demo Video"></iframe>
                    </div>
                    <div class="video-cta">
                        <a href="/login" class="btn btn-primary">Get Started</a>
                    </div>
                </div>
            </section>
        </main>

        <footer class="footer">
            <div class="footer-inner">
                <div class="footer-brand"><small>&copy; 2025 Skill Tesseract</small></div>
                <nav class="footer-links" aria-label="Footer">
                    <a href="/contact" class="footer-link">Contact us</a>
                    <a href="mailto:mockinterview014@gmail.com" class="footer-link">Email</a>
                    <a href="https://www.linkedin.com/company/skill-tesseract/?viewAsMember=true" target="_blank"
                        rel="noopener" class="footer-link">LinkedIn</a>
                    <a href="https://www.instagram.com/skilltesseract" target="_blank" rel="noopener"
                        class="footer-link">Instagram</a>
                </nav>
            </div>
        </footer>
    </div>

    <!-- Login/Signup Status Messages -->
    <div id="message-container" class="message-container" style="display: none;">
        <div id="message" class="message"></div>
    </div>

    <script>
        // Show messages from URL parameters (redirects from login/signup)
        const urlParams = new URLSearchParams(window.location.search);
        const message = urlParams.get('message');
        const type = urlParams.get('type');

        if (message) {
            const messageContainer = document.getElementById('message-container');
            const messageElement = document.getElementById('message');

            messageElement.textContent = decodeURIComponent(message);
            messageElement.className = `message ${type || 'info'}`;
            messageContainer.style.display = 'block';

            // Auto-hide after 5 seconds
            setTimeout(() => {
                messageContainer.style.display = 'none';
            }, 5000);
        }
    </script>
</body>

</html>
